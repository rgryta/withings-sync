services:
  withings-mcp:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
      - autoheal=true
    image: ghcr.io/rgryta/withings-sync:0.1.0
    container_name: withings-mcp
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      WITHINGS_MCP_DSN: postgresql://withings_mcp:${WITHINGS_MCP_DB_PASSWORD}@homelab-postgres:5432/withings
      WITHINGS_MCP_HOST: 0.0.0.0
      WITHINGS_MCP_PORT: "8000"
      WITHINGS_MCP_ALLOWED_HOSTS: withings-mcp
      TZ: Europe/Warsaw
    command:
      - /usr/local/bin/withings-mcp
    networks:
      homelab-network:
        ipv4_address: 172.20.0.93
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/withings-mcp
        - --health-check
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  withings-ingest:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
    image: ghcr.io/rgryta/withings-sync:0.1.0
    container_name: withings-ingest
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      WITHINGS_DSN: postgresql://withings_ingest:${WITHINGS_INGEST_DB_PASSWORD}@homelab-postgres:5432/withings
      WITHINGS_ACCOUNT: ${WITHINGS_ACCOUNT}
      TZ: Europe/Warsaw
    command:
      - /usr/local/bin/withings-ingest
    networks:
      homelab-network:
        ipv4_address: 172.20.0.94
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

networks:
  homelab-network:
    external: true
